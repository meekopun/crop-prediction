[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yield-prediction"
version = "0.1.0"
description = "Historical crop yield summary and benchmark"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.scripts]
yield-prediction = "yield_prediction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
